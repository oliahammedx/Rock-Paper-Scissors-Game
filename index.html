<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-section">

        <!-- Hands -->
        <div class="hands-area">

            <div class="hand">
                <img id="userHand" src="rock.png" alt="Your hand">
            </div>

            <div class="hand2">
                <img id="computerHand" src="paper.png" alt="Computer hand">
            </div>

        </div>

        <!-- Game Title -->
        <h1 class="game-title">Let's Play!!</h1>

        <!-- Game Result -->
        <p id="gameResult" class="game-result">Choose your move</p>

        <!-- Game Choices -->
        <div class="choices">

            <button id="rockBtn" class="choice-button" type="button">
                <img src="rock.png" alt="Rock">
                <span>Rock</span>
            </button>

            <button id="paperBtn" class="choice-button" type="button">
                <img src="paper.png" alt="Paper">
                <span>Paper</span>
            </button>

            <button id="scissorsBtn" class="choice-button" type="button">
                <img src="scissors.png" alt="Scissors">
                <span>Scissors</span>
            </button>

        </div>

        <!-- Score -->
        <div class="score-area">

            <div class="score-box">
                <span>You</span>
                <strong id="userScore">0</strong>
            </div>

            <div class="score-box">
                <span>Computer</span>
                <strong id="computerScore">0</strong>
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
